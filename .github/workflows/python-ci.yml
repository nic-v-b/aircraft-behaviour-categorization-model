name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Compile Python source
        run: python -m compileall -q aircraft_behaviour examples tests trajectory_processing.py clustering_algorithm.py generate_results_visuals.py

      - name: Run unit and regression tests
        run: python -m pytest -q

      - name: Run reproducible clustering demo
        run: python -m examples.run_demo
