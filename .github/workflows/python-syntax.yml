name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyproj

      - name: Compile Python source
        run: python -m compileall -q aircraft_behaviour trajectory_processing.py clustering_algorithm.py generate_results_visuals.py

      - name: Run unit tests
        run: pytest -q
